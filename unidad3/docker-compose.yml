# Copia del stack de la Unidad 3 para efectos de entrega/lectura.
# El stack REAL se levanta desde nodered-debian/ (docker compose up -d),
# porque ahi estan las rutas relativas de los volumenes (./mosquitto, ./datos,
# ./face-service) y los Dockerfile de build de nodered y face-service.
# Este archivo es identico al de nodered-debian/docker-compose.yml.

services:
  mosquitto:
    image: eclipse-mosquitto
    ports: ["8883:8883"]
    volumes: ["./mosquitto:/mosquitto/config"]
    restart: unless-stopped

  nodered:
    build: .
    container_name: nodered-debian
    depends_on:
      - mosquitto
    ports:
      - "1880:1880"
    environment:
      # Token para que los flujos escriban en InfluxDB sin incrustar el secreto en el export
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - nodered_debian_data:/data
      - ./datos:/data/datos
    restart: unless-stopped

  face-service:
    build: ./face-service
    container_name: face-service
    ports:
      - "5000:5000"
    volumes:
      - ./face-service/known_faces:/app/known_faces
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: smarthome
      DOCKER_INFLUXDB_INIT_BUCKET: sensores
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    depends_on:
      - influxdb
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports: ["5678:5678"]
    environment:
      # Sin este flag, n8n exige HTTPS para las cookies de sesion y el login falla en http://localhost
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Santiago
      TZ: America/Santiago
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  nodered_debian_data:
  influxdb_data:
  grafana_data:
  n8n_data:
